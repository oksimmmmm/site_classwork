<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> 
    <title>Document</title>
</head>
<body>
        <main class="card">
            <h1 class="title">Вход</h1>
            <p class="subtitle">Рады видеть вас снова!</p>
            <form class="form" action="#" method="post">
            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email"
            placeholder="you@example.com" required>
                <label class="label" for="password">Пароль</label>
            <input class="input" type="password" id="password" name="password"
                    minlength="8" required>
            <div class="row">
            <label class="check"><input type="checkbox"> Запомнить меня</label>
            <a class="link" href="#">Забыли пароль?</a>
            </div>
            <button class="button" type="submit">Войти</button>
            </form>
            <p class="footer">Нет аккаунта? <a class="link" href="register.html">Зарегистрироваться</a></p>
        </main>
</body>
</html>
